## Dimension 1: reasoning_complexity

This dimension describes how many layers of entity-bridging are needed to reach the final answer.

Choose one:
- One-hop
- Two-hop
- Long-chain

Definitions:
- One-hop:
  The final answer can be obtained by asking directly about the current core entity itself, or by directly identifying one entity that stands in a relation to the current core entity.
  In other words, if the final answer is the related entity itself, it still counts as One-hop.

- Two-hop:
  The question first requires identifying a related entity B from the current entity A, and then requires asking about an attribute of B or another entity related to B.
  In other words, B is not the final answer itself, but an intermediate bridge.
  The step of first identifying the objects in the image cannot be counted as one hop.

- Long-chain:
  The question requires two or more layers of such bridging, e.g., A -> B -> C -> final answer, or multiple dependent sub-questions beyond Two-hop.  The question requires two or more layers of related-entity bridging, e.g., current entity -> related entity A -> related entity B -> final answer;  
  OR the question requires more than two necessary sub-questions about the same entity.

Do NOT count the final related entity itself as an extra hop.
If the question directly asks for the related entity B associated with entity A, label it as One-hop.
Only label it as Two-hop when the question first needs entity B and then asks for additional information about B (or about another entity related to B).

## Dimension 2: question_goal_type

This dimension describes what type of answer the question ultimately asks for.

Choose one:
- Object Identification
- Attribute Lookup
- Relation / Association
- Comparison
- Operation Instruction
- Others

Definitions:
- Object Identification:
  The goal is to determine what the entity itself is called, such as the name of a species, artwork, building, object, or title.

- Attribute Lookup:
  The goal is to retrieve an intrinsic property or factual attribute of the entity itself, such as date, size, style, value, material, composition, location.

- Relation / Association:
  The goal is to identify another entity that stands in a specific relation to the current entity, such as creator, builder, owner, country, naming target, associated person, or related organization.

- Comparison:
  The goal is to compare two or more entities in terms of some property, status, or relation.

- Operation Instruction:
  The goal is to ask about the entity's function, usage, operating rule, placement, or usage instruction.

- Others:
  Use this when the question does not fit the above categories well.

## Important annotation rules
- Focus on the minimal reasoning structure needed for the final answer.
- Do not over-count generic thinking steps.
- Prefer the most specific category that fits the question goal.
- If the question asks for another entity related to the current entity, prefer Relation / Association over Attribute Lookup.
- If the question asks for the entity's own property, prefer Attribute Lookup.
- Remember, the step of first identifying the objects in the image cannot be counted as one hop.

