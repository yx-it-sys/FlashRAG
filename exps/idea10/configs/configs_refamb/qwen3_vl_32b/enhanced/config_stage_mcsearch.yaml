data_dir: data/datasets/
dataset_name: RefAmb
source: mcsearch
split:
  - task_balanced_analysis_subset
test_sample_num: ~
random_sample: false
seed: 2024
save_intermediate_data: true
save_dir: data/result/
save_note: refamb_mcsearch_qwen3_vl_32b_enhanced_stage
save_new_dir: true

gpu_id: ~
framework: api
generator_model: Qwen/Qwen3-VL-32B-Instruct
openai_setting:
  api_key: ~
  base_url: https://api.siliconflow.cn/v1
generator_batch_size: 4
generation_params:
  max_tokens: 2048
  temperature: 0.1
  top_p: 1.0
api_image_max_side: 1024
api_image_quality: 85

retrieval_method: mcsearch
retrieval_model_path: /mnt/data/you/modelscope/bge-large-en-v1.5
corpus_path: null
index_path: null
multimodal_index_path_dict:
  text: null
  image: null
faiss_gpu: false
instruction: null
text_retrieval_topk: 5
image_retrieval_topk: 2
retrieval_batch_size: 16
retrieval_use_fp16: true
retrieval_query_max_length: 64
save_retrieval_cache: false
use_retrieval_cache: false
retrieval_pooling_method: cls
bm25_backend: bm25s
use_sentence_transformer: false
silent_retrieval: false
use_reranker: false
use_multi_retriever: false
image_retrieval_target_modal: image
mcsearch_data_root: /home/you/FlashRAG/exps/idea10/data/datasets/mcsearch/kb
mcsearch_model_weight: /home/you/FlashRAG/exps/idea10/data/datasets/mcsearch/Visualized_base_en_v1.5.pth
mcsearch_visual_bge_model_name: BAAI/bge-base-en-v1.5
mcsearch_visual_bge_model_path: /mnt/data/you/modelscope/bge-large-en-v1.5
mcsearch_score_threshold: 0.0
mcsearch_image_search_topk: 5

metrics:
  - em
  - f1
  - acc
  - precision
  - recall
  - llm
save_metric_score: true
gpt_acc_setting:
    model_name: Pro/deepseek-ai/DeepSeek-V3
    api_key: sk-rktafjgbcwlnvuzmrxhkilhyqiirqozafurqyqmorrydylli
    base_url: https://api.siliconflow.cn/v1

roi_preprocess_config:
  enabled: true
  python_bin: /home/you/miniconda3/envs/dino/bin/python3.11
  script_path: /home/you/FlashRAG/exps/idea10/scripts/groundingdino_roi_worker.py
  groundingdino_root: /home/you/GroundingDINO
  config_file: /home/you/GroundingDINO/groundingdino/config/GroundingDINO_SwinT_OGC.py
  checkpoint_path: /home/you/GroundingDINO/weights/groundingdino_swint_ogc.pth
  device: cpu
  box_threshold: 0.35
  text_threshold: 0.25
  expand_ratio: 0.08
  output_dir: /tmp/omnisearch_roi_cache

crag_search_device: cpu
crag_text_model_name: /mnt/data/you/modelscope/bge-large-en-v1.5
crag_hf_home: /mnt/data/you/huggingface
crag_offline: true
omni_retrieval_char_limit: 8500
omni_retrieved_doc_char_limit: 6000
crag_image_attr_max_chars: 500
crag_image_entity_max_chars: 1200
all_prompts_path: /home/you/FlashRAG/exps/idea10/prompts/new_method/prompt_books.toml
omni_prompt_path: /home/you/FlashRAG/exps/idea10/prompts/new_method/prompt_books.toml
omni_prompt_version: system_vlm_prompt

# Experiments Hyper-parameters
omni_query_similarity_threshold: 0.90
omni_failure_threshold: 0.20
omni_max_repair_count: 2
omni_max_turns: 5
omni_min_effective_retrieval_chars: 10
omni_info_gain_similarity_threshold: 0.9
tightening_module: false
rebuild_module: true

omni_module_log_char_limit: 1200

omni_controller_trace_filename: controller_actions.jsonl

missing_info_repair_module: true

reflection_recovery_module: true

pruning_module: true
