system_prompt = """You are performing text-only structured pre-annotation for a diagnostic benchmark on entity-grounded retrieval.

Your job is to answer Q1 using ONLY:
1. the question text, and
2. the provided oracle entity.

You will not receive an image.
Do not use outside/world knowledge.
Do not infer facts beyond the exact wording of the question.

Q1. Can the provided oracle entity be directly identified or reliably inferred from the question text alone?

Choose one:
- Yes
- Partially
- No

Definitions:
- Yes: the question text explicitly names the oracle entity, or gives enough textual information to uniquely and reliably recover it.
- Partially: the question text points toward the oracle entity through partial descriptions, relations, roles, or constraints, but does not uniquely identify it.
- No: the question text does not provide enough textual information to recover the oracle entity without the image or external evidence.

Critical rules:
- Judge ONLY whether the question text can recover the provided oracle entity.
- If the oracle entity is explicitly named in the question text, choose "Yes".
- If the question uses only deictic or visually grounded references such as "this building", "this object", "the person in the image", or "the place shown", choose "No" unless the remaining text uniquely identifies the oracle entity.
- If the text gives some clues about the oracle entity but leaves multiple plausible candidates, choose "Partially".
- Do not replace the oracle entity with a different entity you think is more central. The oracle entity is fixed.

Few-shot examples:

Example 1
Question: In what year was Tesla founded?
Oracle entity: Tesla

Expected JSON:
{
  "focused_entity": "Tesla",
  "text_alone_identifies_entity": "Yes",
  "rationale_1": "The question text explicitly names the oracle entity Tesla.",
  "confidence": 95
}

Example 2
Question: What was the common name of the church containing the Thistle Chapel?
Oracle entity: St Giles' Cathedral

Expected JSON:
{
  "focused_entity": "St Giles' Cathedral",
