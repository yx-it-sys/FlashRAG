# ---- Global Paths ----
# Paths to models
model2path:
  e5: intfloat/e5-base-v2
  bge: BAAI/bge-base-en-v1.5
  bge-zh: BAAI/bge-large-zh-v1.5
  jina: jinaai/jina-embeddings-v2-base-en
  contriever: facebook/contriever-msmarco
  llama2-13B: meta-llama/Llama-2-13b-hf
  llama2-13B-chat: meta-llama/Llama-2-13b-chat-hf
  llama2-7B: meta-llama/Llama-2-7b-hf
  llama2-7B-chat: meta-llama/Llama-2-7b-chat-hf
  selfrag-llama2-7B: selfrag/selfrag-llama2-7b
  llama3-8B-instruct: meta-llama/Llama-2-8b-instruct-hf
  phi-3: microsoft/phi-3-mini-4k-instruct
  qwen-14B: Qwen/Qwen1.5-14B-Chat
  gemma-7B: google/gemma-7b
  baichuan2-7B-chat: baichuan-inc/Baichuan2-7B-Chat
  proposition: google/flan-t5-large
  mistral-7B-instruct: mistralai/Mistral-7B-Instruct-v0.3
  bge-m3: BAAI/bge-m3
  glm-4-9b-chat: THUDM/glm-4-9b-chat
  qwen2.5-7B-instruct: Qwen/Qwen2.5-7B-Instruct
  llama3.1-8B-instruct: meta-llama/Llama-3.1-8B-Instruct
  qwen2-vl-2B: Qwen/Qwen2-VL-2B-Instruct
  qwen2.5-vl-7B: Qwen/Qwen2.5-VL-7B-Instruct
  internvl2-2B: OpenGVLab/InternVL2-2B
  internvl2-8B: OpenGVLab/InternVL2-8B
  internvl2.5-8B: OpenGVLab/InternVL2.5-8B
  llava-7B: liuhaotian/llava-v1.6-mistral-7b
  llava-7B-onevision-ov: liuhaotian/llava-onevision-7b-ov
  openai-clip: openai/clip-vit-large-patch14
  openai-clip-336: openai/clip-vit-large-patch14-336
  chinese-clip: OFA-Sys/chinese-clip-vit-large-patch14
  jina-clip-v2: jinaai/jina-clip-v2

# Pooling methods for embedding models
model2pooling:
  default: "pooler"
  e5: "mean"
  bge: "cls"
  bge-zh: "cls"
  contriever: "mean"
  bge-m3: "cls"

# Index paths for retrieval methods
method2index:
  e5: ~
  bm25: ~
  contriever: ~
  bge: ~
  bge-m3: ~

# ---- Environment Settings ----
gpu_id: "0"
dataset_name: "infoseek_val"
split: ["validation"]

# Sampling configs
test_sample_num: 10
random_sample: True
save_intermediate_data: True
save_note: "experiment"
seed: 2024

# Data/output paths
data_dir: "data/datasets/"
save_new_dir: True
save_dir: "data/result/"

# ---- Retrieval Settings ----
save_retrieval_cache: True
use_retrieval_cache: False
retrieval_cache_path: "./output/retrieval_cache.json"
silent_retrieval: False
multimodal_index_path_dict:
  text: "/mnt/data/you/datasets/infoseek_val/indexes/clip_Flat_text.index"
  image: ~
retrieval_query_max_length: 64
retrieval_pooling_method: "cls"
retrieval_use_fp16: True
retrieval_batch_size: 16
instruction: ~
retrieval_model_path: "/mnt/data/you/modelscope/clip-vit-large-patch14"
use_sentence_transformer: False
faiss_gpu: False

use_reranker: False
rerank_model_name: e5
rerank_model_path: ~
rerank_pooling_method: ~
rerank_use_fp16: True
rerank_topk: 5
rerank_max_length: 512
rerank_batch_size: 256

# ---- Generator Settings ----
framework: vllm # supports: 'hf', 'vllm', 'fschat'
generator_model: "Qwen2.5-VL-7B-Instruct"
generator_model_path: "/mnt/data/you/modelscope/Qwen2.5-VL-7B-Instruct"
generator_max_input_len: 4096
generator_batch_size: 1
generation_params:
  do_sample: False
  max_tokens: 4096
  temperature: 0.1
  top_p: 1.0

# vLLM-specific settings
vllm_gpu_memory_utilization: 0.95
tensor_parallel_size: 1
max_model_len: 6144
vllm_enforce_eager: true

# ---- Evaluation Settings ----
metrics: ["em", "f1", "acc", "precision", "recall", "input_tokens", "gpt"]
metric_setting:
  retrieval_recall_topk: 5
  tokenizer_name: "gpt-4"
save_metric_score: True

# ---- Prompt Settings ----
visual_clue_prompt_file: "prompts/visual_clue.toml"
