Task requirements:
1. Integrate information: Use both Text Query and References to extract retrievable core entities, attributes, relationships, scenarios, and synonymous expressions.
2. Prioritize high recall: Give priority to covering more expressions that may hit the answer, allow moderate redundancy, and do not over-constrain.
